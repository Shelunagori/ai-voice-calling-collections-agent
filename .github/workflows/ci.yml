name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vca
          POSTGRES_PASSWORD: vca
          POSTGRES_DB: vca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vca" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Mock providers only: CI never needs or receives provider secrets.
      LLM_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      TELEPHONY_ENABLED: "false"
      TEST_DATABASE_URL: postgresql://vca:vca@localhost:5432/vca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic
      - name: Type check
        run: mypy app
      - name: Tests (SQLite + PostgreSQL)
        run: pytest -q
      - name: Migrations match models (PostgreSQL)
        run: DATABASE_URL=$TEST_DATABASE_URL alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL alembic check
      - name: Evaluation suite (mock providers, deterministic)
        run: python -m app.evaluation --out eval-reports/ci-eval.json
      - name: Audio VAD fixtures
        run: python -m app.evaluation.audio_bench signals --out eval-reports/vad-signals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: backend/eval-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vca-backend backend
      - run: docker build -t vca-frontend --build-arg NEXT_PUBLIC_API_BASE_URL=https://example.invalid frontend
      - name: Smoke-test backend image with PostgreSQL
        run: |
          docker network create vca
          docker run -d --name db --network vca -e POSTGRES_USER=vca -e POSTGRES_PASSWORD=vca -e POSTGRES_DB=vca postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U vca && break; sleep 1; done
          docker run -d --name api --network vca -p 8000:8000 -e DATABASE_URL=postgresql://vca:vca@db:5432/vca vca-backend
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break; sleep 1; done
          curl -fsS localhost:8000/ready
          docker logs api | tail -20
